<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Avie Sienna | Contact & Appointment</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg-gradient: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            --card-bg: rgba(30, 41, 59, 0.45);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container Utama - Responsif Flex/Grid */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            width: 100%;
            max-width: 440px; /* Lebar default untuk Mobile */
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        /* Widget Live Date & Time */
        .live-clock-widget {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            align-self: center;
            letter-spacing: 0.5px;
        }
        .live-clock-widget i {
            color: var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Profile Section */
        .profile {
            text-align: center;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            padding: 4px;
            object-fit: cover;
            background: var(--input-bg);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        h1 { font-size: 1.4rem; margin: 16px 0 6px 0; font-weight: 700; letter-spacing: -0.5px; }
        .subtitle { color: var(--accent); font-weight: 600; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; }

        /* Sektor Judul Blok */
        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* List Kontak Sosial */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            background: var(--input-bg);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .contact-item:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            background: rgba(37, 99, 235, 0.08);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .contact-item span { flex-grow: 1; }

        /* Pewarnaan Ikon Kontak */
        .contact-item i.fa-whatsapp { color: #22c55e; font-size: 1.25rem; }
        .contact-item i.fa-instagram { 
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.25rem;
        }
        .contact-item i.fa-envelope { color: #ef4444; font-size: 1.15rem; }
        .contact-item i.fa-arrow-up-right-from-square { color: var(--text-muted); font-size: 0.8rem; opacity: 0.7; }

        /* Form Janji Temu */
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            padding-left: 2px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Tombol Submit Kirim WA */
        .submit-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
            margin-top: 6px;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* ==========================================================================
           MEDIA QUERY: KHUSUS TAMPILAN DESKTOP (Layar Laptop / PC / Tablet Landscape)
           ========================================================================== */
        @media (min-width: 768px) {
            .card {
                max-width: 840px; /* Melebar untuk menampung 2 kolom */
                display: grid;
                grid-template-columns: 1fr 1fr; /* Kolom Kiri & Kolom Kanan sama rata */
                column-gap: 40px;
                row-gap: 20px;
                padding: 45px 40px;
            }

            /* Widget nangkring rapi di rentang dua kolom paling atas */
            .live-clock-widget {
                grid-column: span 2;
                margin-bottom: 5px;
            }

            /* Sisi Kiri: Profil & Sosmed berkumpul rapi */
            .left-side {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                gap: 30px;
            }

            /* Sisi Kanan: Seluruh Form Janji Temu */
            .right-side {
                border-left: 1px solid var(--border-color);
                padding-left: 40px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .footer {
                grid-column: span 2; /* Footer membentang di bawah kedua kolom */
                margin-top: 15px;
                border-top: 1px solid var(--border-color);
                padding-top: 15px;
            }
            
            .profile h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div class="card">
    
    <div class="live-clock-widget">
        <i class="fa-solid fa-circle"></i>
        <span id="liveDateTime">Memuat Waktu...</span>
    </div>

    <div class="left-side">
        <div class="profile">
            <img src="https://lh3.googleusercontent.com/d/1D9T3nny1GzaCv2zm_migNOz12qLOTtqM" alt="Muhammad Avie Sienna" class="profile-img">
            <h1>Muhammad Avie Sienna</h1>
            <div class="subtitle">INFORMASI KONTAK DAN JANJI TAMU</div>
        </div>

        <div>
            <div class="section-title">
                <i class="fa-solid fa-id-card"></i> Hubungi Saya
            </div>
            <div class="contact-list">
                <a href="https://wa.me/6285245867094" target="_blank" class="contact-item">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>WhatsApp Resmi</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
                <a href="https://instagram.com/avieesiennaa_" target="_blank" class="contact-item">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
                <a href="mailto:muhammadaviesiena@gmail.com" class="contact-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>Email</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>
        </div>
    </div>

    <div class="right-side">
        <div class="section-title">
            <i class="fa-regular fa-calendar-plus"></i> Buat Janji Temu
        </div>
        
        <div class="form-container">
            <div class="form-group">
                <label for="clientName">Nama Lengkap</label>
                <input type="text" id="clientName" placeholder="Masukkan nama Anda" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="meetDate">Pilih Tanggal Pertemuan</label>
                <input type="date" id="meetDate">
            </div>

            <div class="form-group">
                <label for="meetTime">Pilih Jam Pertemuan</label>
                <input type="time" id="meetTime">
            </div>

            <button class="submit-btn" onclick="kirimJanjiTemuWA()">
                <i class="fa-regular fa-calendar-check"></i> Ajukan Jadwal via WA
            </button>
        </div>
    </div>

    <div class="footer">
        © <span id="year"></span> Muhammad Avie Sienna
    </div>
</div>

<script>
    // Fungsi Update Jam dan Tanggal Real-Time Otomatis
    function updateLiveClock() {
        const sekarang = new Date();
        
        // Array nama hari dan bulan Indonesia
        const hariList = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const bulanList = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        
        const namaHari = hariList[sekarang.getDay()];
        const tanggal = sekarang.getDate();
        const namaBulan = bulanList[sekarang.getMonth()];
        const tahun = sekarang.getFullYear();
        
        // Format waktu dengan dua digit angka
        let jam = sekarang.getHours();
        let menit = sekarang.getMinutes();
        let detik = sekarang.getSeconds();
        
        jam = jam < 10 ? '0' + jam : jam;
        menit = menit < 10 ? '0' + menit : menit;
        detik = detik < 10 ? '0' + detik : detik;
        
        // Menggabungkan string teks tanggal & jam
        const formatTeks = `${namaHari}, ${tanggal} ${namaBulan} ${tahun} • ${jam}:${menit}:${detik}`;
        
        document.getElementById('liveDateTime').textContent = formatTeks;
    }

    // Jalankan jam live pertama kali, lalu perbarui setiap 1 detik (1000 milidetik)
    updateLiveClock();
    setInterval(updateLiveClock, 1000);

    // Set Tahun Otomatis Mengikuti Waktu Berjalan di Bagian Footer
    document.getElementById("year").textContent = new Date().getFullYear();

    // Atur Batas Minimum Tanggal Pilihan di Input Form (Hari Ini & Seterusnya)
    const hariIni = new Date();
    const yyyy = hariIni.getFullYear();
    let mm = hariIni.getMonth() + 1; 
    let dd = hariIni.getDate();

    if (mm < 10) mm = '0' + mm;
    if (dd < 10) dd = '0' + dd;

    const formatHariIni = yyyy + '-' + mm + '-' + dd;
    const inputTanggal = document.getElementById('meetDate');
    
    inputTanggal.min = formatHariIni; 
    inputTanggal.value = formatHariIni; 

    // Fungsi Mengirim Data Form Otomatis Menjadi Chat WA Berformat Rapi
    function kirimJanjiTemuWA() {
        const nama = document.getElementById('clientName').value.trim();
        const tanggal = document.getElementById('meetDate').value;
        const jam = document.getElementById('meetTime').value;
        const nomorWA = "6285245867094";

        if (!nama) {
            alert("Silakan masukkan nama Anda terlebih dahulu.");
            return;
        }
        if (!tanggal || !jam) {
            alert("Silakan pilih tanggal dan jam janji temu.");
            return;
        }

        // Format konversi tanggal (YYYY-MM-DD menjadi DD/MM/YYYY)
        const parts = tanggal.split('-');
        const tanggalFormatIndo = `${parts[2]}/${parts[1]}/${parts[0]}`;

        const isiPesan = `Halo Pak Avie,\nSaya *${nama}* ingin mengajukan janji temu.\n\n` +
                         `📅 *Tanggal:* ${tanggalFormatIndo}\n` +
                         `⏰ *Jam:* ${jam} WIB\n\n` +
                         `Apakah jadwal tersebut kosong? Terima kasih.`;

        const encodedText = encodeURIComponent(isiPesan);
        const urlWhatsApp = `https://wa.me/${nomorWA}?text=${encodedText}`;

        window.open(urlWhatsApp, '_blank');
    }
</script>

</body>
</html>
